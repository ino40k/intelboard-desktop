name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-2025
            target: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        shell: bash
        run: node -e "const expected='v'+require('./package.json').version; if(process.env.GITHUB_REF_NAME!==expected)throw Error('Tag must match '+expected)"
      - run: npm test
      - run: npm run build
      - name: Linux runtime prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64
      - name: Configure Chromium sandbox on the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Linux hidden desktop smoke
        if: runner.os == 'Linux'
        run: timeout 75s xvfb-run -a npm run test:desktop
      - name: Windows hidden desktop smoke
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Package
        run: npm run package:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Linux packaged runtime smoke
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          timeout 75s xvfb-run -a npm run test:desktop
        env:
          INTELBOARD_TEST_BINARY: ./release/linux-unpacked/intelboard
      - name: Windows packaged runtime smoke
        if: runner.os == 'Windows'
        run: npm run test:desktop
        env:
          INTELBOARD_TEST_BINARY: ./release/win-unpacked/IntelBoard.exe
      - name: Audit staged source and packaged application
        run: npm run audit:release
      - run: node scripts/checksums.js
      - uses: actions/upload-artifact@v4
        with:
          name: IntelBoard-${{ matrix.target }}-x64
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.sha256
  attach-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: IntelBoard-*
          path: installers
          merge-multiple: true
      - name: Attach files to the release the maintainer published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" installers/* --clobber
