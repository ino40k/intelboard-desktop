name: Desktop builds
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-2025
            target: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/network/go.mod
          cache-dependency-path: native/network/go.sum
      - run: npm ci
      - run: npx install-electron --no
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        shell: bash
        run: node -e "const expected='v'+require('./package.json').version; if(process.env.GITHUB_REF_NAME!==expected)throw Error('Tag must match '+expected)"
      - run: npm run build:network
      - run: go test ./...
        working-directory: native/network
      - run: npm test
      - run: npm run build
      - name: Linux runtime prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64
      - name: Configure Chromium sandbox on the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Linux hidden desktop smoke
        if: runner.os == 'Linux'
        run: timeout 75s xvfb-run -a npm run test:desktop
      - name: Windows desktop smoke
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Linux collaborative editor smoke
        if: runner.os == 'Linux'
        run: timeout 75s xvfb-run -a npm run test:collaboration-ui
      - name: Windows collaborative editor smoke
        if: runner.os == 'Windows'
        run: npm run test:collaboration-ui
      - name: Linux canvas interaction checks
        if: runner.os == 'Linux'
        run: timeout 120s xvfb-run -a sh -c 'npm run test:canvas && npm run test:canvas:shared'
      - name: Windows canvas interaction checks
        if: runner.os == 'Windows'
        run: |
          npm run test:canvas
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:canvas:shared
      - name: Package
        run: npm run package:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Validate updater metadata against the actual package
        run: npm run updates:metadata
      - name: Linux packaged runtime smoke
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          timeout 75s xvfb-run -a npm run test:desktop
        env:
          INTELBOARD_TEST_BINARY: ./release/linux-unpacked/intelboard
      - name: Windows packaged runtime smoke
        if: runner.os == 'Windows'
        run: npm run test:desktop
        env:
          INTELBOARD_TEST_BINARY: ./release/win-unpacked/IntelBoard.exe
      - name: Linux packaged collaboration smoke
        if: runner.os == 'Linux'
        run: timeout 75s xvfb-run -a npm run test:collaboration-ui
        env:
          INTELBOARD_TEST_BINARY: ./release/linux-unpacked/intelboard
      - name: Windows packaged collaboration smoke
        if: runner.os == 'Windows'
        run: npm run test:collaboration-ui
        env:
          INTELBOARD_TEST_BINARY: ./release/win-unpacked/IntelBoard.exe
      - name: Linux packaged canvas interaction checks
        if: runner.os == 'Linux'
        run: timeout 120s xvfb-run -a sh -c 'npm run test:canvas && npm run test:canvas:shared'
        env:
          INTELBOARD_TEST_BINARY: ./release/linux-unpacked/intelboard
      - name: Windows packaged canvas interaction checks
        if: runner.os == 'Windows'
        run: |
          npm run test:canvas
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:canvas:shared
        env:
          INTELBOARD_TEST_BINARY: ./release/win-unpacked/IntelBoard.exe
      - name: Windows installer acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - name: Build actual old and new updater test packages
        run: node scripts/build-update-fixtures.js
      - name: Permit Chromium user namespaces for AppImage tests on this disposable runner
        if: runner.os == 'Linux'
        run: |
          if command -v apparmor_parser >/dev/null; then
            sudo tee /etc/apparmor.d/intelboard-updater-tests >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile intelboard-updater-tests /tmp/appimage_extracted_*/intelboard flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/intelboard-updater-tests
          fi
      - name: Linux real AppImage stable and experimental update/restart tests
        if: runner.os == 'Linux'
        run: timeout 360s xvfb-run -a node scripts/test-updater-e2e.js
      - name: Windows real NSIS stable and experimental update/restart tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # NSIS relaunches through IShellDispatch2, supplied by Explorer.
          # Hosted Server runners may not start the desktop shell automatically.
          $session = (Get-Process -Id $PID).SessionId
          if (-not (Get-Process explorer -ErrorAction SilentlyContinue | Where-Object SessionId -eq $session)) {
            Start-Process "$env:WINDIR\explorer.exe"
          }
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $desktopShell = Get-Process explorer -ErrorAction SilentlyContinue | Where-Object SessionId -eq $session
            if ($desktopShell) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if (-not $desktopShell) { throw 'The NSIS restart test requires an Explorer shell in the current desktop session.' }
          Write-Output "NSIS restart shell ready in Windows session $session"
          node scripts/test-updater-e2e.js
      - name: Audit staged source and packaged application
        run: npm run audit:release
      - run: node scripts/checksums.js
      - uses: actions/upload-artifact@v4
        with:
          name: IntelBoard-${{ matrix.target }}-x64
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.sha256
            release/*.blockmap
            release/latest.yml
            release/latest-linux.yml
            release/experimental.yml
            release/experimental-linux.yml
  dependency-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/dependency-sources.py
      - run: node scripts/checksums.js
      - uses: actions/upload-artifact@v4
        with:
          name: IntelBoard-dependency-sources
          if-no-files-found: error
          path: |
            release/*-dependency-sources.zip
            release/*-dependency-sources.zip.sha256
  attach-release:
    if: github.event_name == 'release'
    needs: [build, dependency-sources]
    runs-on: ubuntu-24.04
    concurrency:
      group: signed-release-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: IntelBoard-*
          path: installers
          merge-multiple: true
      # No npm install or dependency code is executed in the signing job.
      # A missing secret fails closed; ordinary push/PR builds never receive it.
      - name: Verify both platforms and sign the complete release marker
        env:
          INTELBOARD_UPDATE_SIGNING_KEY: ${{ secrets.INTELBOARD_UPDATE_SIGNING_KEY }}
        run: node scripts/sign-updates.js installers
      - name: Upload payloads, verify GitHub digests, publish readiness marker last
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-update.js installers
